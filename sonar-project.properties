# Analisis de SonarQube Cloud para el backend del Core (T6 de QA).
# Lo ejecuta .github/workflows/sonar.yml solo si el repo tiene el secret
# SONAR_TOKEN; projectKey y organization tienen que coincidir con el proyecto
# creado en sonarcloud.io.
sonar.projectKey=fpedaccio_core_desappsii
sonar.organization=fpedaccio
sonar.projectName=Core - Municipalidad UADE

sonar.sources=backend/app
sonar.tests=backend/tests
sonar.exclusions=backend/app/seeds/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# El job falla si el Quality Gate no pasa.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
