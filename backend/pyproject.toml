[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "muni-core"
version = "1.0.0"
description = "Modulo Core de la plataforma municipal distribuida: identidad, integracion, notificaciones y monitoreo"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aio-pika>=9.5",
    "pyjwt[crypto]>=2.10",
    "bcrypt>=4.2",
    "jsonschema>=4.23",
    "structlog>=24.4",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/workers/*",          # entrypoints de procesos, se testean los servicios que invocan
    "app/messaging/rabbitmq.py",  # adaptador de I/O real; cubierto por FakeBroker + smoke manual
    "migrations/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # FastAPI usa llamadas en los defaults (Depends/Query) por diseno.
    "B008",
    # `str, Enum` en vez de `StrEnum`: los enums se persisten como texto y se
    # serializan a JSON, y heredar de `str` hace explicito que el valor ES la
    # cadena que va a la base. Con StrEnum el comportamiento cambia sutil.
    "UP042",
    # `Generic[T]` en vez de los type params de PEP 695: funciona igual y
    # `PageResponse` tiene que seguir siendo un modelo pydantic generico.
    "UP046",
]
