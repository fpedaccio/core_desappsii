<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="72" text-anchor="middle" font-size="40" font-weight="700" fill="#1a1a2e">Sin el patrón</text>
  <text x="640" y="112" text-anchor="middle" font-size="24" fill="#6b7280">Cada servicio habla directo con RabbitMQ</text>

  <g transform="translate(0,78)">

  <!-- servicios -->
  <g>
    <rect x="90" y="180" width="280" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="230" y="212" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a2e">EventHubService</text>
    <text x="230" y="233" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#c0392b">import aio_pika</text>

    <rect x="90" y="272" width="280" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="230" y="304" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a2e">DeliveryService</text>
    <text x="230" y="325" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#c0392b">import aio_pika</text>

    <rect x="90" y="364" width="280" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="230" y="396" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a2e">RegistryService</text>
    <text x="230" y="417" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#c0392b">import aio_pika</text>

    <rect x="90" y="456" width="280" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="230" y="488" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a2e">StatsService</text>
    <text x="230" y="509" text-anchor="middle" font-size="14" font-family="Menlo, monospace" fill="#c0392b">import aio_pika</text>
  </g>

  <!-- flechas -->
  <defs>
    <marker id="rojo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <g stroke="#c0392b" stroke-width="2.5" marker-end="url(#rojo)" fill="none">
    <path d="M370,212 C500,212 560,300 690,340"/>
    <path d="M370,304 C500,304 570,320 690,348"/>
    <path d="M370,396 C500,396 570,380 690,362"/>
    <path d="M370,488 C500,488 560,420 690,372"/>
  </g>

  <!-- rabbitmq -->
  <rect x="700" y="300" width="230" height="110" rx="10" fill="#fef2f2" stroke="#c0392b" stroke-width="2.5"/>
  <text x="815" y="345" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">RabbitMQ</text>
  <text x="815" y="375" text-anchor="middle" font-size="16" fill="#6b7280">aio-pika</text>

  <!-- consecuencias -->
  <g>
    <text x="975" y="200" font-size="19" font-weight="700" fill="#c0392b">Las consecuencias</text>

    <text x="975" y="248" font-size="17" fill="#374151">Para correr los tests</text>
    <text x="975" y="272" font-size="17" font-weight="600" fill="#1a1a2e">hay que instalar RabbitMQ</text>

    <text x="975" y="330" font-size="17" fill="#374151">Cambiar de broker obliga a</text>
    <text x="975" y="354" font-size="17" font-weight="600" fill="#1a1a2e">reescribir la lógica de negocio</text>

    <text x="975" y="412" font-size="17" fill="#374151">La lógica queda mezclada</text>
    <text x="975" y="436" font-size="17" font-weight="600" fill="#1a1a2e">con plomería de conexiones</text>
  </g>

  <line x1="950" y1="180" x2="950" y2="470" stroke="#e5e7eb" stroke-width="2"/>
  </g>
</svg>
