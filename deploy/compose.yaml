name: muni-core

x-app: &app
  build:
    context: ../backend
  image: muni-core-backend:local
  environment: &environment
    ENVIRONMENT: production
    DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://core_app:${APP_DB_PASSWORD:?Missing APP_DB_PASSWORD}@postgres:5432/muni_core
    RABBITMQ_URL: amqp://core:${RABBITMQ_PASSWORD:?Run prepare_local.py}@rabbitmq:5672/core
    BROKER_REQUIRED: "true"
    JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  secrets:
    - jwt_private_key
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: muni_core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare_local.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d muni_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: core-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: core
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run prepare_local.py}
      RABBITMQ_DEFAULT_VHOST: core
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  seed:
    <<: *app
    environment:
      <<: *environment
      SEED_INITIAL_PASSWORD: ${SEED_INITIAL_PASSWORD:?Run prepare_local.py}
    command: ["python", "-m", "app.seeds"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)); assert d['status']=='up'"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.inbox_worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ../../core-frontend
      args:
        VITE_API_URL: /api/v1
    image: muni-core-frontend:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

secrets:
  jwt_private_key:
    file: ./secrets/jwt-private.pem
