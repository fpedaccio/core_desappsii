name: muni-core

x-app: &app
  build:
    context: ../backend
  image: ${CORE_BACKEND_IMAGE:-muni-core-backend:local}
  environment: &environment
    ENVIRONMENT: production
    DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://core_app:${APP_DB_PASSWORD:?Missing APP_DB_PASSWORD}@postgres:5432/muni_core
    RABBITMQ_URL: amqp://core:${RABBITMQ_PASSWORD:?Run prepare_local.py}@rabbitmq:5672/core
    BROKER_REQUIRED: "true"
    JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  secrets:
    - jwt_private_key
  restart: unless-stopped

services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: muni_core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare_local.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d muni_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: rabbitmq:4-management-alpine
    hostname: core-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: core
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run prepare_local.py}
      RABBITMQ_DEFAULT_VHOST: core
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  seed:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    <<: *app
    environment:
      <<: *environment
      SEED_INITIAL_PASSWORD: ${SEED_INITIAL_PASSWORD:?Run prepare_local.py}
    command: ["python", "-m", "app.seeds"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)); assert d['status']=='up'"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    <<: *app
    command: ["python", "-m", "app.workers.inbox_worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ${CORE_FRONTEND_PATH:-../../core-frontend}
      args:
        VITE_API_URL: /api/v1
    image: ${CORE_FRONTEND_IMAGE:-muni-core-frontend:local}
    ports:
      - "127.0.0.1:${CORE_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_PATH:-./secrets/jwt-private.pem}
