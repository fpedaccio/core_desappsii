name: Backend CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Backend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Build backend package
        run: python -m build

  lint:
    name: Backend - Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

  test:
    name: Backend - Test (PyTest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PyTest with line and branch coverage
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Verify business-service coverage thresholds
        run: python ../deploy/check_coverage.py coverage.json --output coverage-summary.json

      - name: Test deployment quality tooling
        run: python -m unittest discover -s ../deploy/tests -v

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/coverage.json
            backend/coverage.xml
            backend/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  testing-bootstrap:
    name: Backend - Clean testing bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start complete stack from empty testing state
        run: timeout 840s python3 deploy/testing_up.py --project-name muni-core-testing-ci --port 18082

      - name: Verify reproducible startup evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("deploy/.testing/bootstrap-result.json").read_text())
          assert result["backend_ref"] == os.environ["TESTED_SHA"], "Unexpected backend revision"
          assert result["backend_dirty"] is False, "Tracked/untracked source changed during startup"
          assert result["fresh_credentials_and_no_previous_volumes"] is True, "State was reused"
          assert result["project"] == "muni-core-testing-ci", "Unexpected Compose project"
          assert result["http_port"] == 18082, "Unexpected HTTP port"
          assert result["ready"] is True and result["worker_consumers"] is True
          assert 0 < result["seconds"] <= 900, "Startup exceeded 15 minutes"
          print("Fresh stack, exact commit, API and worker verified.")
          PY

      - name: Collect container status without secrets
        if: always()
        run: |
          if [ -f deploy/.testing/.env ]; then
            docker compose --project-name muni-core-testing-ci \
              --env-file deploy/.testing/.env -f deploy/compose.yaml \
              ps --all > deploy/.testing/containers.txt
          fi

      - name: Upload sanitized startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deploy/.testing/bootstrap-result.json
            deploy/.testing/containers.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Stop runner-local testing stack
        if: always()
        run: |
          if [ -f deploy/.testing/.env ]; then
            docker compose --project-name muni-core-testing-ci \
              --env-file deploy/.testing/.env -f deploy/compose.yaml down
          fi

  deploy:
    name: Backend - CD
    needs: [build, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CORE_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: core-production-deploy
      cancel-in-progress: false
    env:
      CORE_COMPONENT: backend
      CORE_CD_MODE: ${{ vars.CORE_CD_MODE || '--check' }}
      AWS_PAGER: ""
      AWS_MAX_ATTEMPTS: "3"
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::026056481545:role/core-github-deploy
          aws-region: us-east-1
          role-duration-seconds: 3600
          allowed-account-ids: "026056481545"
          role-session-name: core-${{ github.run_id }}

      - name: Execute and monitor SSM command
        run: python3 .github/scripts/deploy_ssm.py
