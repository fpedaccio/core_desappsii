name: Backend CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Backend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Build backend package
        run: python -m build

  lint:
    name: Backend - Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

  test:
    name: Backend - Test (PyTest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PyTest
        run: pytest

      - name: Test isolated testing bootstrap
        run: python -m unittest discover -s ../deploy/tests -v

  deploy:
    name: Backend - CD
    needs: [build, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CORE_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: core-production-deploy
      cancel-in-progress: false
    env:
      CORE_COMPONENT: backend
      CORE_CD_MODE: ${{ vars.CORE_CD_MODE || '--check' }}
      AWS_PAGER: ""
      AWS_MAX_ATTEMPTS: "3"
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::026056481545:role/core-github-deploy
          aws-region: us-east-1
          role-duration-seconds: 3600
          allowed-account-ids: "026056481545"
          role-session-name: core-${{ github.run_id }}

      - name: Execute and monitor SSM command
        run: python3 .github/scripts/deploy_ssm.py
