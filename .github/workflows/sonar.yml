name: Sonar quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Backend - Sonar quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Sonar token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not configured: the Sonar analysis did not run."
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure coverage for Sonar
        if: steps.token.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest --cov=app --cov-branch --cov-report=xml:coverage.xml

      - name: Analyze and wait for the quality gate
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
