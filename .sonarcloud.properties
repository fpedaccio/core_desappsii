# Configuracion del Automatic Analysis de SonarQube Cloud (QA T6).
# Si se pasa al analisis por CI (.github/workflows/sonar.yml), Sonar ignora
# este archivo y usa sonar-project.properties.

sonar.python.version=3.12

# Duplicacion: se excluyen solo los arneses de prueba de deploy/ que repiten
# a proposito el mismo flujo en dos entornos (stack aislado e integrado).
# El codigo de la aplicacion (backend/app) sigue sujeto a la condicion.
# Justificacion: docs/testing/sonar-quality-gate.md
sonar.cpd.exclusions=deploy/e2e/**,deploy/e2e_run.py,deploy/integrated_e2e_run.py
